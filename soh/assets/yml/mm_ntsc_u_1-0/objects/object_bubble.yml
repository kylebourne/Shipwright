# Majora's Mask object_bubble, generated by soh/assets/tools/mm-port/mm_object_to_yml.py.
# Offsets come from the MM decomp's assets/xml/N64_US/objects/object_bubble.xml; vertex blocks
# are found by scanning the display lists. Paths are under mm/ so they never collide
# with Ocarina's files.
:config:
  directory: mm/objects/object_bubble
  segments:
    - [ 6, 0x00EDD390 ]
  external_files:
    - mm_ntsc_u_1-0/objects/gameplay_keep.yml

gBubbleTex:
  type: TEXTURE
  offset: 0x0
  symbol: gBubbleTex
  format: IA8
  width: 64
  height: 64

gBubbleDL:
  type: GFX
  offset: 0x1000
  symbol: gBubbleDL

object_bubbleVtx_001080:
  type: OOT:ARRAY
  offset: 0x1080
  symbol: object_bubbleVtx_001080
  count: 4
  array_type: VTX
  zero_flag: true
  null_cross_file: true
