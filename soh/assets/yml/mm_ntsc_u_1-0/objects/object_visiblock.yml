# Majora's Mask object_visiblock, generated by soh/assets/tools/mm-port/mm_object_to_yml.py.
# Offsets come from the MM decomp's assets/xml/N64_US/objects/object_visiblock.xml; vertex blocks
# are found by scanning the display lists. Paths are under mm/ so they never collide
# with Ocarina's files.
:config:
  directory: mm/objects/object_visiblock
  segments:
    - [ 6, 0x012AE680 ]
  external_files:
    - mm_ntsc_u_1-0/objects/gameplay_keep.yml

gLensOfTruthPlatformDL:
  type: GFX
  offset: 0x140
  symbol: gLensOfTruthPlatformDL

gLensOfTruthPlatformEmptyDL:
  type: GFX
  offset: 0x1E8
  symbol: gLensOfTruthPlatformEmptyDL

gLensOfTruthPlatformTex:
  type: TEXTURE
  offset: 0x1F0
  symbol: gLensOfTruthPlatformTex
  format: RGBA16
  width: 32
  height: 32

gLensOfTruthPlatformCol:
  type: OOT:COLLISION
  offset: 0xAD0
  symbol: gLensOfTruthPlatformCol

object_visiblockVtx_000000:
  type: OOT:ARRAY
  offset: 0x0
  symbol: object_visiblockVtx_000000
  count: 20
  array_type: VTX
  zero_flag: true
  null_cross_file: true
