# Majora's Mask object_tree, generated by soh/assets/tools/mm-port/mm_object_to_yml.py.
# Offsets come from the MM decomp's assets/xml/N64_US/objects/object_tree.xml; vertex blocks
# are found by scanning the display lists. Paths are under mm/ so they never collide
# with Ocarina's files.
:config:
  directory: mm/objects/object_tree
  segments:
    - [ 6, 0x0148DAE0 ]
  external_files:
    - mm_ntsc_u_1-0/objects/gameplay_keep.yml

gTreeBodyDL:
