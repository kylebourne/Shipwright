  offset: 0x680
  symbol: gTreeBodyDL

gTreeLeavesDL:
  type: GFX
  offset: 0x7C8
  symbol: gTreeLeavesDL

gTreeBodyTex:
  type: TEXTURE
  offset: 0x8B8
  symbol: gTreeBodyTex
  format: RGBA16
  width: 32
  height: 32

gTreeLeavesTex:
  type: TEXTURE
  offset: 0x10B8
  symbol: gTreeLeavesTex
  format: RGBA16
  width: 32
  height: 32

gTreeTopCol:
  type: OOT:COLLISION
  offset: 0x1B2C
  symbol: gTreeTopCol

object_treeVtx_000000:
